# 菜单设置 (去掉了容易报错的横杠，改用标准缩进)
menu:
  主页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  链接:
    友情链接: /link/ || fas fa-link
    常用工具: /tools/ || fas fa-tools

# 导航栏
nav:
  display_title: true
  fixed: true

# 首页顶图 
index_img: https://img.picgo.net/2024/05/22/luoxiaohei.gif
index_top_img_height: 70vh

# 副标题 
subtitle:
  enable: false



# 点击特效：爱心
click_effects:
  enable: true
  type: heart

# 侧边丝带
canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.6
  zIndex: -1

# 代码块
code_blocks:
  enable: true
  theme: light
  copy_button: true

# 自定义注入
inject:
  head:
    - <style>.navbar-brand { color: #8e44ad !important; } #site-subtitle { animation: titleScale 1s; } @keyframes titleScale { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }</style>
  bottom:
    - <script src="https://cdn.jsdelivr.net/npm/butterfly-extsrc/dist/click-heart.min.js"></script>